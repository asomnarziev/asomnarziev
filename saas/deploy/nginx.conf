# nginx: pbx.atcpbx.uz -> uvicorn (127.0.0.1:8000).  HTTPS:  certbot --nginx -d pbx.atcpbx.uz
# (sites-available faylining boshida: http konteksti, shuning uchun limit_req_zone shu yerda turishi mumkin)

# Kirish sahifasi uchun tezlik chegarasi (brute-force'dan qo'shimcha himoya; ilovaning o'zida ham bor)
limit_req_zone $binary_remote_addr zone=pbx_login:10m rate=10r/m;

server {
    listen 80;
    server_name pbx.atcpbx.uz;
    server_tokens off;
    client_max_body_size 12m;   # to'lov cheklari uchun (MAX_RECEIPT_MB=8)

    location = /login {
        limit_req zone=pbx_login burst=10 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # Jonli yangilanish (SSE): bufferlash o'chiq, uzoq ulanishga ruxsat
    # Zaxirani tiklash: shifrlangan zaxira fayli yuklanadi (ilovada chegara 40 MB)
    location = /admin/restore/inspect {
        client_max_body_size 45m;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /live/stream {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        include proxy_params;   # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_pass http://127.0.0.1:8000;
    }
}
