<h1>{{ "Ro'yxatdan o'tish" if mode=="register" else "Kirish" }}</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><p><input name="email" type="email" placeholder="Email" required></p>

{% endblock %}
